                "@type": "Answer",
                "text": "Everything is encrypted with AES-256-GCM. Your master password is stretched into a key using PBKDF2-SHA256 with 600,000 iterations, and that key never leaves your device. Because encryption and decryption happen locally, EnigmaKeep follows a zero-knowledge model: there is no server that could read your data even in principle."

                "@type": "Answer",

              "acceptedAnswer": {
                "@type": "Answer",
                "text": "When you set up your vault you receive a 12-word recovery phrase. Keep it somewhere safe and offline. If you forget the master password, that phrase restores access. Without either the password or the phrase, the data cannot be recovered — that is the trade-off of true zero-knowledge encryption."
              }
            },
            {
              "@type": "Question",
              "name": "What is the opaque vault file?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "When you export your vault, EnigmaKeep writes an opaque binary .dat. There are no magic bytes, PEM banners, or plaintext metadata — a packet capture or hex dump sees random-looking data."
